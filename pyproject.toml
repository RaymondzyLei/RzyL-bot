[project]
name = "rzyl-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RaymondzyLei", email = "raymond.zy.lei@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "nonebot-adapter-console>=0.10.0",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-plugin-docs>=2.5.0",
    "nonebot2[fastapi]>=2.5.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.3",
]

[project.scripts]
rzyl-bot = "rzyl_bot:main"

[[tool.uv.index]]
url = "https://uv.agentsmirror.com/pypi/simple"
default = true

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
# uv_build 默认只打包一个与项目名同名的顶层模块（src/rzyl_bot）。
# core 要与它并列，所以显式列两个名字。官方更推荐拆成 workspace 多包，
# 若这条路出问题就退回 workspace —— 见 issue #1 的 Further Notes。
module-name = ["rzyl_bot", "rzyl_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
