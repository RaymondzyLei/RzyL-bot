[project]
name = "rzyl-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RaymondzyLei", email = "raymond.zy.lei@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "nonebot-adapter-console>=0.10.0",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-plugin-docs>=2.5.0",
    "nonebot2[fastapi]>=2.5.0",
]

[project.scripts]
rzyl-bot = "rzyl_bot:main"

[[tool.uv.index]]
url = "https://uv.agentsmirror.com/pypi/simple"
default = true

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
